<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Cord | Realtime Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-screen bg-[#313338] text-[#f2f3f5] flex">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-[#2b2d31] p-8 rounded-2xl border border-[#383a40] space-y-5">
      <div class="text-center">
        <h2 class="text-2xl font-bold">Welcome to M-Cord</h2>
        <p id="authSubtitle" class="text-sm text-[#949ba4] mt-1">Log in to continue</p>
      </div>
      <form id="authForm" class="space-y-3">
        <input id="authUsername" type="text" placeholder="Username (2-20 chars)" minlength="2" maxlength="20"
          class="hidden w-full px-3 py-2 bg-[#1e1f22] border border-[#383a40] rounded-lg">
        <input id="authEmail" type="email" placeholder="Email" required
          class="w-full px-3 py-2 bg-[#1e1f22] border border-[#383a40] rounded-lg">
        <input id="authPassword" type="password" placeholder="Password (min 6 chars)" required minlength="6"
          class="w-full px-3 py-2 bg-[#1e1f22] border border-[#383a40] rounded-lg">
        <button type="submit" id="authSubmit"
          class="w-full py-2.5 bg-[#5865f2] hover:bg-[#4752c4] rounded-lg font-semibold">Log In</button>
      </form>
      <p class="text-xs text-center text-[#949ba4]">
        <span id="authToggleText">Need an account?</span>
        <button id="authToggle" type="button" class="text-[#5865f2] font-semibold ml-1 hover:underline">Register</button>
      </p>
      <p id="authError" class="hidden text-red-400 text-xs text-center"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="hidden flex-1 flex overflow-hidden">
    <aside class="w-56 bg-[#2b2d31] flex flex-col p-3 gap-1">
      <h3 class="text-xs font-bold uppercase text-[#949ba4] px-2 mb-2">Channels</h3>
      <div id="channelList" class="flex flex-col gap-1"></div>
      <div class="mt-auto flex items-center justify-between text-sm px-2">
        <span id="meName" class="truncate"></span>
        <button id="logoutBtn" class="text-xs text-[#949ba4] hover:text-white">Log out</button>
      </div>
    </aside>

    <section class="flex-1 flex flex-col min-w-0">
      <header class="h-12 px-4 flex items-center border-b border-[#1e1f22] font-semibold">
        # <span id="channelTitle" class="ml-1">general</span>
      </header>
      <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <form id="sendForm" class="p-4">
        <input id="msgInput" type="text" maxlength="500" placeholder="Message #general" autocomplete="off"
          class="w-full px-4 py-3 bg-[#383a40] rounded-lg outline-none">
      </form>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'https://rctywvvmoktgijzrdvxf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HAOnhxht4tFOrH5pH19mQw_OxsJngPm';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CHANNELS = ['general', 'random', 'games'];
    let user = null;
    let room = 'general';
    let isRegister = false;
    let sub = null;

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function displayName(u) {
      return u?.user_metadata?.username || u?.email?.split('@')[0] || 'user';
    }

    function showAuthError(msg) {
      $('authError').textContent = msg;
      $('authError').classList.remove('hidden');
    }

    // ---------- Auth ----------
    $('authToggle').onclick = () => {
      isRegister = !isRegister;
      $('authSubmit').textContent = isRegister ? 'Register' : 'Log In';
      $('authSubtitle').textContent = isRegister ? 'Create an account' : 'Log in to continue';
      $('authToggleText').textContent = isRegister ? 'Already have an account?' : 'Need an account?';
      $('authToggle').textContent = isRegister ? 'Log in' : 'Register';
      $('authUsername').classList.toggle('hidden', !isRegister);
      $('authUsername').required = isRegister;
      $('authError').classList.add('hidden');
    };

    $('authForm').onsubmit = async e => {
      e.preventDefault();
      const email = $('authEmail').value.trim();
      const password = $('authPassword').value;
      const username = $('authUsername').value.trim();
      $('authError').classList.add('hidden');

      let res;
      if (isRegister) {
        res = await sb.auth.signUp({ email, password, options: { data: { username } } });
        if (!res.error && !res.data.session) {
          showAuthError('Account created. Check your email to confirm, then log in.');
          return;
        }
      } else {
        res = await sb.auth.signInWithPassword({ email, password });
      }
      if (res.error) showAuthError(res.error.message);
    };

    $('logoutBtn').onclick = () => sb.auth.signOut();

    sb.auth.onAuthStateChange((_event, session) => {
      if (session) showApp(session.user);
      else showAuth();
    });

    function showAuth() {
      user = null;
      if (sub) { sb.removeChannel(sub); sub = null; }
      $('appScreen').classList.add('hidden');
      $('authScreen').classList.remove('hidden');
    }

    function showApp(u) {
      user = u;
      $('meName').textContent = displayName(u);
      $('authScreen').classList.add('hidden');
      $('appScreen').classList.remove('hidden');
      renderChannels();
      switchRoom('general');
    }

    // ---------- Channels ----------
    function renderChannels() {
      $('channelList').innerHTML = '';
      CHANNELS.forEach(name => {
        const btn = document.createElement('button');
        btn.textContent = '# ' + name;
        btn.dataset.room = name;
        btn.className = 'text-left px-2 py-1 rounded hover:bg-[#35373c]';
        btn.onclick = () => switchRoom(name);
        $('channelList').appendChild(btn);
      });
      highlightRoom();
    }

    function highlightRoom() {
      document.querySelectorAll('#channelList button').forEach(b => {
        b.classList.toggle('bg-[#404249]', b.dataset.room === room);
        b.classList.toggle('text-white', b.dataset.room === room);
      });
    }

    async function switchRoom(name) {
      room = name;
      $('channelTitle').textContent = name;
      $('msgInput').placeholder = 'Message #' + name;
      highlightRoom();
      await loadMessages();
      subscribeToRoom();
    }

    async function loadMessages() {
      $('messages').innerHTML = '';
      const { data, error } = await sb
        .from('messages')
        .select('*')
        .eq('room', room)
        .order('created_at', { ascending: true })
        .limit(100);
      if (error) {
        $('messages').innerHTML = `<p class="text-red-400 text-sm">${esc(error.message)}</p>`;
        return;
      }
      data.forEach(addMessage);
      scrollToBottom();
    }

    function subscribeToRoom() {
      if (sub) sb.removeChannel(sub);
      sub = sb.channel('room-' + room)
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${room}` },
          payload => {
            addMessage(payload.new);
            scrollToBottom();
          })
        .subscribe();
    }

    function addMessage(m) {
      const div = document.createElement('div');
      div.innerHTML = `
        <div>
          <span class="font-semibold text-[#f2f3f5]">${esc(m.username)}</span>
          <span class="text-xs text-[#949ba4] ml-2">${new Date(m.created_at).toLocaleTimeString()}</span>
        </div>
        <p class="text-[#dbdee1]">${esc(m.content)}</p>`;
      $('messages').appendChild(div);
    }

    function scrollToBottom() {
      const box = $('messages');
      box.scrollTop = box.scrollHeight;
    }

    $('sendForm').onsubmit = async e => {
      e.preventDefault();
      const content = $('msgInput').value.trim();
      if (!content || !user) return;
      $('msgInput').value = '';

      const { error } = await sb.from('messages').insert({
        room,
        content,
        username: displayName(user),
        user_id: user.id
      });
      if (error) alert('Message not sent: ' + error.message);
    };
  </script>
</body>
</html>
